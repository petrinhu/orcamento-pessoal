---
name: skrooge
confinement: strict
grade: stable
base: core24
adopt-info: skrooge
version: 26.1.20
apps:
  skrooge:
    extensions:
      - kde-neon-6
    common-id: org.kde.skrooge.desktop
    desktop: usr/share/applications/org.kde.skrooge.desktop
    command: usr/bin/skrooge
    plugs:
      - home
      - audio-playback
      - browser-support
slots:
  session-dbus-interface:
    interface: dbus
    name: org.kde.skrooge
    bus: session
parts:
  skrooge:
    parse-info:
      - usr/share/metainfo/org.kde.skrooge.appdata.xml
    plugin: cmake
    source: https://download.kde.org/stable/skrooge/skrooge-25.10.0.tar.xz
    build-packages:
      - libofx-dev
      - libsqlcipher-dev
      - libpulse0
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DSKG_BUILD_TEST=OFF"
      - "-DSKG_DESIGNER=OFF"
      - "-DCMAKE_FIND_ROOT_PATH=$CRAFT_STAGE\\;/snap/kde-qt6-core24-sdk/current\\;/snap/kf6-core24-sdk/current/usr"
      - "-DCMAKE_PREFIX_PATH=$CRAFT_STAGE\\;/snap/kde-qt6-core24-sdk/current\\;/snap/kf6-core24-sdk/current/usr"
    build-environment:
      - LD_LIBRARY_PATH: $LD_LIBRARY_PATH:/snap/kde-qt6-core24-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/snap/kde-qt6-core24-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:/snap/kf6-core24-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/usr
      - PKG_CONFIG_PATH: /snap/kde-qt6-core24-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig
    prime:
      - -usr/lib/*/cmake/*
      - -usr/include/*
      - -usr/share/ECM/*
      - -usr/share/man/*
      - -usr/bin/X11
      - -usr/lib/gcc/$CRAFT_ARCH_TRIPLET_BUILD_FOR/6.0.0
      - -usr/lib/aspell/*
      - -usr/share/lintian
  cleanup:
    after:
      - skrooge
    plugin: nil
    build-snaps:
      - core24
      - kf6-core24
    override-prime: |
      set -eux
      for snap in "core24" "kf6-core24"; do
          cd "/snap/$snap/current" && find . -type f,l -exec rm -rf "${CRAFT_PRIME}/{}" \;
      done
