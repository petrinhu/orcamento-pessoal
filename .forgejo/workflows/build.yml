name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nota de portabilidade:
#   O projeto usa QXlsx, que depende da API PRIVADA do Qt (QZipReader via
#   private/qzipreader_p.h) -> exige Qt6::GuiPrivate. O cmake-config desse
#   modulo so existe no Qt >= 6.9, fornecido pelo pacote qt6-qtbase-private-devel.
#   Por isso a imagem e fedora:42 (Qt 6.10), nao fedora:41 (Qt 6.8).
#
#   O matrix Debian/Arch foi removido daqui porque cada distro tem um problema
#   distinto com a API privada do Qt (Debian stable traz Qt 6.8 sem o config;
#   Arch promove o aviso de "private module" a erro). A validacao multi-distro
#   volta na fase de distribuicao (Onda 8 / #148) com tratamento por-distro.
#
#   QT_QPA_PLATFORM=offscreen e obrigatorio: os testes rodam em container headless
#   (sem display); sem isso, os testes com QTEST_MAIN abortam por falta de plugin
#   de plataforma Qt.

jobs:
  build:
    name: Build + Test (Fedora)
    runs-on: codeberg-medium
    container:
      image: fedora:42
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtcharts-devel qt6-qttools-devel \
            openssl-devel libsecret-devel libsodium-devel \
            poppler-qt6-devel \
            gcc-c++ cmake make git nodejs
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (Release + tests)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test (ctest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error

  lint:
    name: Lint (cppcheck + clang-tidy)
    runs-on: codeberg-small
    container:
      image: fedora:42
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtcharts-devel qt6-qttools-devel \
            openssl-devel libsecret-devel libsodium-devel \
            poppler-qt6-devel \
            gcc-c++ cmake make git clang-tools-extra cppcheck nodejs
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (gera compile_commands.json)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # GATE real (DIST-08): mesma categoria/config do pre-commit hook local
      # (scripts/pre-commit) — --enable=warning (só bugs prováveis, sem
      # style/performance/portability que viram ruído), .cppcheck-suppressions
      # já cobre falsos-positivos Qt (Q_OBJECT, aggregate-init de POD, etc).
      # error-exitcode=2 real: falha o job se achar bug de verdade — valida
      # 0 achados nessa categoria em todo o /src antes deste commit.
      - name: cppcheck (gate — categoria "warning", mesma do pre-commit hook)
        run: |
          cppcheck --enable=warning \
                   --library=qt \
                   --language=c++ --std=c++20 \
                   --inline-suppr \
                   --suppressions-list=.cppcheck-suppressions \
                   --error-exitcode=2 \
                   --quiet \
                   src

      # INFORMATIVO (não bloqueia): categorias mais ruidosas (style/
      # performance/portability) ficam de backlog de triagem futura —
      # DIST-08 mapeou ~1053 achados no repo completo (incl. 155
      # ignoredReturnErrorCode a triar, classe do bug do #146). Reduzir a
      # ruído e promover achados reais para o gate é trabalho de uma onda
      # futura dedicada, não deste item.
      - name: cppcheck (informativo — style/performance/portability, backlog futuro)
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --quiet --std=c++20 --suppress=missingInclude \
                   --library=qt \
                   --error-exitcode=0 \
                   src/services src/repositories src/models

      # INFORMATIVO (não bloqueia, DIST-07): o gate estava OFF por premissa
      # desatualizada ("crasha no GCC16") — revalidado 0-crash com LLVM 22.
      # Reativado como sinal visível no CI, mas ainda NÃO bloqueia build:
      # backlog estimado ~2-3k avisos em todo o /src (nunca triado). Rodar
      # primeiro sobre src/services (inclui FinanceEngine/TvmService — os
      # bugprone-easily-swappable-parameters de parâmetros financeiros
      # trocáveis, classe mais sensível) é o próximo passo de uma onda
      # futura de triagem; aqui só medimos e reportamos.
      - name: clang-tidy (informativo — não bloqueia, backlog de triagem futuro)
        continue-on-error: true
        run: |
          clang-tidy -p build $(find src -name '*.cpp') 2>&1 | tee clang-tidy-report.txt
          echo "── resumo: $(grep -c 'warning:' clang-tidy-report.txt || true) avisos, $(grep -c 'error:' clang-tidy-report.txt || true) erros"

  sanitizers:
    name: ASan + UBSan (Fedora)
    runs-on: codeberg-medium
    container:
      image: fedora:42
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtcharts-devel qt6-qttools-devel \
            openssl-devel libsecret-devel libsodium-devel \
            poppler-qt6-devel \
            gcc-c++ cmake make git libasan libubsan nodejs
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (Debug + sanitizers)
        run: |
          cmake -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize -j$(nproc)
      - name: Run tests with sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=.lsan-suppress.txt
        run: ctest --test-dir build-sanitize --output-on-failure --no-tests=error
